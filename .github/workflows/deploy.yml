name: Deploy Aikid Academy to GitHub Pages

# Publishes the static site (HTML/CSS/JS) to GitHub Pages on every push.
on:
  push:
    branches:
      - claude/code-org-ai-game-xcvufy
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Step 1: turn GitHub Pages on (first run only) and build the artifact.
  # This job has NO `environment:` so it can run even before Pages exists.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Pages (auto-enables on first run, no-op afterward)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

  # Step 2: deploy. By now Pages is enabled, so the github-pages
  # environment resolves correctly.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
