<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maze Puzzles — Aikid Academy</title>
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    .maze-layout { display: grid; grid-template-columns: 220px 1fr 240px; gap: 18px; align-items: start; }
    @media (max-width: 880px) { .maze-layout { grid-template-columns: 1fr; } }

    #grid { display: grid; gap: 4px; background: #d8cdf2; padding: 8px; border-radius: 16px; }
    .cell {
      width: 100%; aspect-ratio: 1 / 1; border-radius: 8px;
      display: flex; align-items: center; justify-content: center; font-size: 28px;
      background: #fff;
    }
    .cell.wall { background: #6b4fa3; }
    .cell.goal { background: #d6ffe0; }
    .robot { font-size: 30px; transition: transform 0.25s ease, left 0.25s, top 0.25s; }

    .level-pills { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 14px; }
    .pill { border: none; cursor: pointer; font-family: inherit; font-weight: bold; font-size: 16px;
            padding: 8px 14px; border-radius: 999px; background: #eee; }
    .pill.active { background: var(--purple); color: #fff; }
    .pill.done::after { content: " ⭐"; }

    .toolbox-title { font-weight: bold; font-size: 16px; margin: 4px 0; color: #666; }
    .program-block { position: relative; }
    .program-block .del {
      position: absolute; top: 4px; right: 6px; background: #ffffff66; border: none;
      border-radius: 50%; width: 24px; height: 24px; cursor: pointer; font-weight: bold; color: #fff;
    }
    .nested { margin-top: 8px; }
    .stepper button { width: 26px; height: 26px; border-radius: 8px; border: none; font-size: 18px;
                      font-weight: bold; cursor: pointer; background: #ffffff55; color: #fff; }
    .actions { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
    .speech { background: #fff; border-radius: 14px; padding: 12px; font-size: 16px; min-height: 50px;
              box-shadow: var(--card-shadow); margin-bottom: 14px; }
  </style>
</head>
<body>
  <header class="topbar">
    <span class="logo">🧩</span>
    <h1>Maze Puzzles</h1>
    <span class="spacer"></span>
    <a class="home-btn" href="../index.html">🏠 Home</a>
  </header>

  <main class="wrap">
    <div class="level-pills" id="levelPills"></div>
    <div class="speech" id="speech">Build a program to help 🤖 reach the goal 🏁. Tap a block to add it!</div>

    <div class="maze-layout">
      <!-- Toolbox -->
      <div class="panel">
        <div class="toolbox-title">🧱 Blocks</div>
        <div class="block" data-type="move" draggable="true"><span class="ico">⬆️</span> Move</div>
        <div class="block" data-type="left" draggable="true"><span class="ico">↪️</span> Turn Left</div>
        <div class="block" data-type="right" draggable="true"><span class="ico">↩️</span> Turn Right</div>
        <div class="block" data-type="repeat" draggable="true"><span class="ico">🔁</span> Repeat</div>
        <div class="block" data-type="if" draggable="true"><span class="ico">❓</span> If Path Ahead</div>
        <p style="font-size:13px;color:#888;margin-top:10px;">
          Tap to add to your program. Drag a block <b>onto</b> a 🔁 or ❓ block to put it inside!
        </p>
      </div>

      <!-- Maze grid -->
      <div class="panel" style="text-align:center;">
        <div id="grid"></div>
      </div>

      <!-- Program -->
      <div class="panel">
        <div class="toolbox-title">📜 My Program</div>
        <div class="dropzone" id="program" data-container="root">
          <div class="placeholder">Tap blocks to build here…</div>
        </div>
        <div class="actions">
          <button class="btn green" id="runBtn">▶️ Run</button>
          <button class="btn orange" id="resetBtn">↺ Reset</button>
          <button class="btn gray" id="clearBtn">🗑️ Clear</button>
        </div>
      </div>
    </div>
  </main>

  <div class="toast" id="toast"></div>
  <script src="../js/maze.js"></script>
</body>
</html>
